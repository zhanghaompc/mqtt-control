<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MQTT 远程控制</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #333; padding: 12px; padding-bottom: 40px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card h2 { font-size: 15px; margin-bottom: 10px; color: #222; }
  .row { display: flex; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
  .row label { width: 64px; font-size: 13px; color: #666; flex-shrink: 0; }
  .row input { flex: 1; min-width: 120px; height: 34px; border: 1px solid #ddd; border-radius: 8px; padding: 0 10px; font-size: 14px; outline: none; }
  .row input:focus { border-color: #3A7BD5; }
  button { border: none; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; background: #f0f3f8; color: #333; }
  button:active { opacity: .8; }
  button.primary { background: #3A7BD5; color: #fff; }
  button.danger { background: #e74c3c; color: #fff; }
  #status { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; color: #fff; }
  #status.on { background: #07c160; }
  #status.busy { background: #ffb800; }
  #status.off { background: #999; }
  .temp-wrap { display: flex; align-items: center; gap: 10px; }
  .temp { font-size: 28px; font-weight: 600; min-width: 80px; text-align: center; }
  .step { width: 40px; height: 34px; font-size: 20px; padding: 0; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .grid button { flex: 1; min-width: 58px; padding: 8px 0; }
  .grid button.active { background: #3A7BD5; color: #fff; }
  .log { background: #1d2129; border-radius: 8px; padding: 10px; max-height: 260px; overflow-y: auto; font-size: 12px; font-family: monospace; }
  .log p { color: #9cdcfe; margin-bottom: 6px; word-break: break-all; }
  .log p.in { color: #b5e8a1; }
  .log p .t { color: #666; margin-right: 8px; }
  .env { font-size: 13px; color: #888; margin-bottom: 10px; }
  .status-text { font-size: 12px; color: #888; margin-top: 6px; word-break: break-all; }
  .quick { display: flex; gap: 8px; margin-top: 8px; }
  .quick button { flex: 1; }
</style>
</head>
<body>
  <div class="card">
    <h2>MQTT 连接</h2>
    <div class="row"><label>服务器</label><input id="host" placeholder="broker-cn.emqx.io"></div>
    <div class="row">
      <label>端口</label><input id="port" type="number" placeholder="8084">
      <label style="width:auto">加密</label><input id="tls" type="checkbox" checked>
    </div>
    <div class="row"><label>路径</label><input id="path" placeholder="/mqtt"></div>
    <div class="row"><label>用户名</label><input id="username" placeholder="留空=匿名"></div>
    <div class="row"><label>密码</label><input id="password" type="password" placeholder="留空=匿名"></div>
    <div class="row"><label>主题</label><input id="topic" placeholder="ac/esp32ac"></div>
    <div class="row">
      <span id="status" class="off">未连接</span>
      <button id="btnConnect" class="primary">连接</button>
      <button id="btnDisconnect" class="danger">断开</button>
    </div>
  </div>

  <div class="card">
    <h2>空调控制</h2>
    <div class="env" id="env">--</div>
    <div class="row">
      <label>电源</label>
      <label style="width:auto"><input type="checkbox" id="power"> 开</label>
    </div>
    <div class="row">
      <label>温度</label>
      <div class="temp-wrap">
        <button class="step" id="tempMinus">−</button>
        <span class="temp" id="temp">26°C</span>
        <button class="step" id="tempPlus">+</button>
      </div>
    </div>
    <div class="grid" id="modeGrid"></div>
    <div class="grid" id="speedGrid"></div>
    <div class="status-text" id="pows"></div>
  </div>

  <div class="card">
    <h2>通用发布（任意设备）</h2>
    <div class="row"><label>主题</label><input id="pubTopic" placeholder="topic/in"></div>
    <div class="row"><label>内容</label><input id="pubPayload" placeholder="发送 JSON 或文本"></div>
    <div class="quick">
      <button id="plugOn">插座开</button>
      <button id="plugOff">插座关</button>
      <button id="pubSend" class="primary">发送</button>
    </div>
  </div>

  <div class="card">
    <h2>消息日志</h2>
    <div class="log" id="log"></div>
  </div>

<script src="mqtt.min.js"></script>
<script>
const MODES = ["自动", "制冷", "制热", "除湿", "送风"];
const SPEEDS = ["自动", "低速", "中速", "强劲"];

let client = null;
let temp = 26, modeIndex = 1, speedIndex = 2, powerOn = false;

const cfg = {
  host: "broker-cn.emqx.io", port: 8084, path: "/mqtt", tls: true,
  username: "", password: "", topic: "ac/esp32ac"
};

const $ = id => document.getElementById(id);

function loadCfg() {
  try {
    const saved = JSON.parse(localStorage.getItem("mqtt_cfg_web") || "{}");
    Object.assign(cfg, saved);
  } catch (e) {}
  $("host").value = cfg.host;
  $("port").value = cfg.port;
  $("path").value = cfg.path;
  $("tls").checked = cfg.tls;
  $("username").value = cfg.username;
  $("password").value = cfg.password;
  $("topic").value = cfg.topic;
  $("pubTopic").value = cfg.topic + "/in";
}

function saveCfg() {
  cfg.host = $("host").value.trim() || "broker-cn.emqx.io";
  cfg.port = parseInt($("port").value) || 8084;
  cfg.path = $("path").value.trim() || "/mqtt";
  cfg.tls = $("tls").checked;
  cfg.username = $("username").value.trim();
  cfg.password = $("password").value;
  cfg.topic = $("topic").value.trim() || "ac/esp32ac";
  localStorage.setItem("mqtt_cfg_web", JSON.stringify(cfg));
  $("pubTopic").value = cfg.topic + "/in";
}

function setStatus(text, cls) {
  const s = $("status");
  s.textContent = text;
  s.className = cls;
}

function log(msg, incoming) {
  const p = document.createElement("p");
  if (incoming) p.className = "in";
  const now = new Date().toTimeString().slice(0, 8);
  const t = document.createElement("span");
  t.className = "t";
  t.textContent = now;
  p.appendChild(t);
  p.appendChild(document.createTextNode(msg));
  const box = $("log");
  box.insertBefore(p, box.firstChild);
  while (box.children.length > 100) box.removeChild(box.lastChild);
}

function buildUrl() {
  const proto = cfg.tls ? "wss" : "ws";
  return proto + "://" + cfg.host + ":" + cfg.port + (cfg.path || "/mqtt");
}

function renderControls() {
  $("temp").textContent = temp + "°C";
  $("power").checked = powerOn;
  document.querySelectorAll("#modeGrid button").forEach((b, i) => b.className = i === modeIndex ? "active" : "");
  document.querySelectorAll("#speedGrid button").forEach((b, i) => b.className = i === speedIndex ? "active" : "");
}

function parseStatus(msg) {
  if (msg.indexOf("{") === 0) {
    try {
      const j = JSON.parse(msg);
      if (j.degrees !== undefined) temp = Math.round(j.degrees);
      if (j.temp !== undefined && j.degrees === undefined) temp = Math.round(j.temp);
      if (j.power !== undefined) powerOn = !!j.power;
      if (j.mode >= 0 && j.mode < MODES.length) modeIndex = j.mode;
      if (j.speed >= 0 && j.speed < SPEEDS.length) speedIndex = j.speed;
      $("env").textContent = "温度 " + (j.temp !== undefined ? Number(j.temp).toFixed(1) : "--") + "℃ / 湿度 " +
        (j.humidity !== undefined ? Number(j.humidity).toFixed(1) : "--") + "%";
      if (j.pows) $("pows").textContent = j.pows;
      renderControls();
    } catch (e) {}
  } else if (msg.indexOf("temp=") === 0) {
    const t = msg.match(/temp=([\d.]+)/);
    if (t) temp = parseInt(t[1]);
    const m = msg.match(/mode=(\d+)/);
    if (m && parseInt(m[1]) < MODES.length) modeIndex = parseInt(m[1]);
    const s = msg.match(/speed=(\d+)/);
    if (s && parseInt(s[1]) < SPEEDS.length) speedIndex = parseInt(s[1]);
    const p = msg.match(/power=(on|off)/);
    if (p) powerOn = p[1] === "on";
    renderControls();
  }
}

function send(cmd) {
  if (!client || !client.connected) { alert("请先连接"); return; }
  const topic = cfg.topic + "/in";
  client.publish(topic, cmd);
  log(topic + " : " + cmd);
}

function connect() {
  saveCfg();
  if (client) { try { client.end(true); } catch (e) {} }
  setStatus("连接中…", "busy");
  log("连接 " + buildUrl());
  client = mqtt.connect(buildUrl(), {
    username: cfg.username || undefined,
    password: cfg.password || undefined,
    clientId: "web_mqtt_" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 5000,
    connectTimeout: 10000
  });
  client.on("connect", () => {
    setStatus("已连接", "on");
    log("已连接");
    client.subscribe(cfg.topic + "/#", { qos: 0 });
  });
  client.on("message", (topic, payload) => {
    const msg = payload.toString();
    log(topic + " : " + msg, true);
    parseStatus(msg);
  });
  client.on("close", () => { setStatus("未连接", "off"); log("连接已断开"); });
  client.on("error", e => { setStatus("错误", "off"); log("错误: " + ((e && e.message) || e)); });
}

function disconnect() {
  if (client) { try { client.end(true); } catch (e) {} client = null; }
  setStatus("未连接", "off");
}

// 初始化
MODES.forEach((m, i) => {
  const b = document.createElement("button");
  b.textContent = m;
  b.onclick = () => { modeIndex = i; send("temp=" + temp + ";mode=" + i + ";speed=" + speedIndex + ";power=on"); renderControls(); };
  $("modeGrid").appendChild(b);
});
SPEEDS.forEach((s, i) => {
  const b = document.createElement("button");
  b.textContent = s;
  b.onclick = () => { speedIndex = i; send("temp=" + temp + ";mode=" + modeIndex + ";speed=" + i + ";power=on"); renderControls(); };
  $("speedGrid").appendChild(b);
});

$("btnConnect").onclick = connect;
$("btnDisconnect").onclick = disconnect;
$("power").onchange = () => {
  powerOn = $("power").checked;
  send(powerOn ? "temp=" + temp + ";mode=" + modeIndex + ";speed=" + speedIndex + ";power=on" : "power=off");
};
$("tempMinus").onclick = () => { temp = Math.max(16, temp - 1); renderControls(); send("temp=" + temp + ";mode=" + modeIndex + ";speed=" + speedIndex + ";power=on"); };
$("tempPlus").onclick = () => { temp = Math.min(30, temp + 1); renderControls(); send("temp=" + temp + ";mode=" + modeIndex + ";speed=" + speedIndex + ";power=on"); };
$("pubSend").onclick = () => {
  if (!client || !client.connected) { alert("请先连接"); return; }
  const topic = $("pubTopic").value.trim() || (cfg.topic + "/in");
  client.publish(topic, $("pubPayload").value);
  log(topic + " : " + $("pubPayload").value);
};
$("plugOn").onclick = () => { $("pubPayload").value = '{"m":"on","v":"1"}'; $("pubSend").click(); };
$("plugOff").onclick = () => { $("pubPayload").value = '{"m":"on","v":"0"}'; $("pubSend").click(); };

loadCfg();
renderControls();
</script>
</body>
</html>
